name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
      - run: make setup
      - run: make lint
      - run: make test
      - run: pnpm --filter @physix/web run build
